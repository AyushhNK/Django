{% extends "baselayout.html" %}

{% block content %}
<style>
    .login-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-card {
        background: #ffffff;
        padding: 2.5rem;
        width: 100%;
        max-width: 400px;
        border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .login-card h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #333;
        font-weight: 600;
    }

    .login-card form p {
        margin-bottom: 1rem;
    }

    .login-card input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 14px;
        outline: none;
    }

    .login-card input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        margin-top: 1rem;
        border: none;
        border-radius: 8px;
        background: #667eea;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    .login-btn:hover {
        background: #5a67d8;
    }

    .login-footer {
        margin-top: 1rem;
        text-align: center;
        font-size: 14px;
        color: #555;
    }

    .login-footer a {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
    }

    .login-footer a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-container">
    <div class="login-card">
        <h2>Chat App Login</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="login-btn">
                Login
            </button>
        </form>

        <div class="login-footer">
            Don’t have an account?
            <a>Sign up</a>
        </div>
    </div>
</div>
{% endblock %}

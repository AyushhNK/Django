{% extends 'baselayout.html' %}

{% block content %}
<div class="flex h-screen bg-gray-100">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r">
        <div class="p-4 text-xl font-semibold border-b">
            💬 Users
        </div>

        <div class="p-2 space-y-2 overflow-y-auto">
            {% for u in users %}
                <a href="/send_message/{{u}}"
                   class="block px-4 py-2 rounded-lg hover:bg-blue-100 text-gray-700 font-medium">
                    {{ u }}
                </a>
            {% endfor %}
        </div>
    </aside>

    <!-- Chat Section -->
    <section class="flex flex-col flex-1">

        <!-- Header -->
        <header class="bg-white border-b p-4 text-lg font-semibold">
            Hello, {{ request.user.username }} 👋
        </header>

        <!-- Messages -->
        <div id="messages"
             class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50">
        </div>

        <!-- Input -->
        <div class="p-4 bg-white border-t flex items-center gap-3">
            <input
                type="text"
                id="id_message_send_input"
                placeholder="Type your message..."
                class="flex-1 px-4 py-2 rounded-full border focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
            <button
                id="id_message_send_button"
                class="px-6 py-2 rounded-full bg-blue-600 text-white font-semibold hover:bg-blue-700 transition">
                Send
            </button>
        </div>

    </section>
</div>

<script>
    const chatSocket = new WebSocket(
        "ws://" + window.location.host + "/"
    );

    chatSocket.onopen = function () {
        console.log("WebSocket connected");
    };

    chatSocket.onclose = function () {
        console.log("WebSocket disconnected");
    };

    document.querySelector("#id_message_send_input").onkeyup = function (e) {
        if (e.key === "Enter") {
            document.querySelector("#id_message_send_button").click();
        }
    };

    document.querySelector("#id_message_send_button").onclick = function () {
        const input = document.querySelector("#id_message_send_input");
        const message = input.value.trim();
        if (!message) return;

        chatSocket.send(JSON.stringify({
            message: message,
            username: "{{ request.user.username }}"
        }));

        input.value = "";
    };

    chatSocket.onmessage = function (e) {
        const data = JSON.parse(e.data);
        const messages = document.querySelector("#messages");

        const wrapper = document.createElement("div");
        const isMe = data.username === "{{ request.user.username }}";

        wrapper.className = `flex ${isMe ? "justify-end" : "justify-start"}`;

        const bubble = document.createElement("div");
        bubble.className = `
            max-w-xs px-4 py-2 rounded-2xl text-sm
            ${isMe
                ? "bg-blue-600 text-white rounded-br-none"
                : "bg-white text-gray-800 rounded-bl-none border"}
        `;
        bubble.innerHTML = `<strong>${data.username}</strong><br>${data.message}`;

        wrapper.appendChild(bubble);
        messages.appendChild(wrapper);

        messages.scrollTop = messages.scrollHeight;
    };
</script>
{% endblock %}
